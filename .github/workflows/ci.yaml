name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
          cache: true

      - run: bun install --frozen-lockfile

      - run: bun run check-ci

      - run: bun run build

  # Flags new high/critical advisories and licenses outside the list in the PR diff.
  # The project is ISC, so copyleft (GPL/AGPL) is not on the list. Beyond the FMC
  # template: MIT-0 (@csstools), BlueOak-1.0.0 (sax, lru-cache), OFL-1.1 (Open Sans
  # font) and CC-BY-4.0 (caniuse-lite data) are already in the tree.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, Unlicense, CC0-1.0, BlueOak-1.0.0, OFL-1.1, CC-BY-4.0
