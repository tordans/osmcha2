# Copy to project bunfig.toml (local/dev). Do not COPY into Docker before bun install.
# @see references/bun-install.md

# Supply-chain cooldown — only install versions published at least N seconds ago.
# @see https://bun.com/docs/runtime/bunfig#install-minimumreleaseage
[install]
minimumReleaseAge = 432000 # 5 days (5 × 24 × 60 × 60 seconds)
minimumReleaseAgeExcludes = [
  "typescript",
  "@typescript/typescript-darwin-arm64",
  "@typescript/typescript-linux-x64",
  "oxfmt",
  "oxlint",
  # Bun 1.4 does not glob scoped packages; list native bindings with the parent.
  "@oxlint/binding-android-arm64",
  "@oxlint/binding-android-arm-eabi",
  "@oxlint/binding-darwin-arm64",
  "@oxlint/binding-darwin-x64",
  "@oxlint/binding-freebsd-x64",
  "@oxlint/binding-linux-arm-gnueabihf",
  "@oxlint/binding-linux-arm-musleabihf",
  "@oxlint/binding-linux-arm64-gnu",
  "@oxlint/binding-linux-arm64-musl",
  "@oxlint/binding-linux-ppc64-gnu",
  "@oxlint/binding-linux-riscv64-gnu",
  "@oxlint/binding-linux-riscv64-musl",
  "@oxlint/binding-linux-s390x-gnu",
  "@oxlint/binding-linux-x64-gnu",
  "@oxlint/binding-linux-x64-musl",
  "@oxlint/binding-openharmony-arm64",
  "@oxlint/binding-win32-arm64-msvc",
  "@oxlint/binding-win32-ia32-msvc",
  "@oxlint/binding-win32-x64-msvc",
  "oxc-transform-react",
  "@oxc-transform-react/binding-android-arm64",
  "@oxc-transform-react/binding-android-arm-eabi",
  "@oxc-transform-react/binding-darwin-arm64",
  "@oxc-transform-react/binding-darwin-x64",
  "@oxc-transform-react/binding-freebsd-x64",
  "@oxc-transform-react/binding-linux-arm-gnueabihf",
  "@oxc-transform-react/binding-linux-arm-musleabihf",
  "@oxc-transform-react/binding-linux-arm64-gnu",
  "@oxc-transform-react/binding-linux-arm64-musl",
  "@oxc-transform-react/binding-linux-ppc64-gnu",
  "@oxc-transform-react/binding-linux-riscv64-gnu",
  "@oxc-transform-react/binding-linux-riscv64-musl",
  "@oxc-transform-react/binding-linux-s390x-gnu",
  "@oxc-transform-react/binding-linux-x64-gnu",
  "@oxc-transform-react/binding-linux-x64-musl",
  "@oxc-transform-react/binding-openharmony-arm64",
  "@oxc-transform-react/binding-win32-arm64-msvc",
  "@oxc-transform-react/binding-win32-ia32-msvc",
  "@oxc-transform-react/binding-win32-x64-msvc",
  "@vitejs/plugin-react",
  "vite",
  "vitest",
  "@vitest/expect",
  "@vitest/mocker",
  "@vitest/pretty-format",
  "@vitest/runner",
  "@vitest/snapshot",
  "@vitest/spy",
  "@vitest/utils",
  "@osm-editor-kit/maplibre-editor-layer-index",
]

# Global virtual store — install once, link everywhere (requires isolated linker). Local/dev only.
# Reinstall after changing linker/store: rm -rf node_modules && bun install
# Vite dev: server.fs.allow — @see references/bun-install.md
# Phantom deps inside third-party packages: trustedDependencies / patch — @see references/bun-install.md
# @see https://bun.com/docs/pm/global-store
linker = "isolated"
globalStore = true
